[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [
    { name = "Kaio Fellipe Barbosa Dantas", email = "fd98329@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.163.1,<0.164.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "typos (>=1.52.2,<2.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:warnings --cov=fast_zero --cov-context=test"

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[tool.poe]
poetry_command = ""

[tool.poe.tasks]
lint = "ruff check"
format.sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
]
serve = "fastapi dev fast_zero/app.py"
test.sequence = [
    "lint",
    { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
    { cmd = "coverage html --show-contexts" },
]
